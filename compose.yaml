name: jjti-web
services:
  gateway:
    image: caddy@sha256:003a97808e781aa9f7e75cc2f43d34d461099031faf5e20faefb9f61126836f0
    restart: unless-stopped
    environment:
      SITE_ORIGIN: ${SITE_ORIGIN:?Define SITE_ORIGIN}
    ports: ["${HTTP_PORT:-80}:80", "${HTTPS_PORT:-443}:443"]
    volumes: ["./infra/Caddyfile:/etc/caddy/Caddyfile:ro", "caddy_data:/data", "caddy_config:/config"]
    depends_on: [api]
    networks: [web]
  api:
    image: jjti-web-api:${IMAGE_TAG:-local}
    build: .
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    environment:
      NODE_ENV: production
      SITE_ORIGIN: ${SITE_ORIGIN:?}
      DATABASE_URL: postgresql://jjti_app:${DB_PASSWORD:?}@db:5432/jjti
      DATA_KEY: ${DATA_KEY:?}
      ANALYTICS_KEY: ${ANALYTICS_KEY:?}
      IP_RATE_KEY: ${IP_RATE_KEY:?}
      TRUSTED_PROXIES: ${INTERNAL_SUBNET:-172.30.0.0/24}
      RELEASE_SHA: ${RELEASE_SHA:-unreleased}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_FROM: ${SMTP_FROM:-}
      SMTP_TO: ${SMTP_TO:-info@jj-ti.net}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://collector:4318
    depends_on:
      db:
        condition: service_healthy
      collector:
        condition: service_started
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3000/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 8s
      retries: 3
    networks: [web]
  db:
    image: postgres@sha256:a77aa70e641402a21411b92b721c58d10f23b50ae5fdd2333efd22d166e1e5f7
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      DB_PASSWORD: ${DB_PASSWORD:?}
      GRAFANA_DB_PASSWORD: ${GRAFANA_DB_PASSWORD:?}
    volumes: ["postgres_data:/var/lib/postgresql/data", "./infra/postgres/init.sh:/docker-entrypoint-initdb.d/10-jjti.sh:ro"]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U postgres -d jjti"]
      interval: 5s
      retries: 15
    networks: [web]
  prometheus:
    image: prom/prometheus@sha256:e04987641b57704f408e31f6373ba4138ecf27cb4a165d24aabb6c38fddd0f06
    restart: unless-stopped
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.retention.time=15d"]
    volumes: ["./.runtime/prometheus.yml:/etc/prometheus/prometheus.yml:ro", "./infra/alerts.yaml:/etc/prometheus/alerts.yaml:ro", "prometheus_data:/prometheus"]
    ports: ["127.0.0.1:${PROMETHEUS_PORT:-9090}:9090"]
    networks: [web]
  grafana:
    image: grafana/grafana@sha256:0615ec4fbd4072004b7d86b46ded63013a74b7d6eb1119273dd89e8fa25c13cf
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: jjti-admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?}
      GF_USERS_ALLOW_SIGN_UP: 'false'
      GF_AUTH_ANONYMOUS_ENABLED: 'false'
      GRAFANA_DB_PASSWORD: ${GRAFANA_DB_PASSWORD:?}
    volumes: ["grafana_data:/var/lib/grafana", "./infra/grafana/provisioning:/etc/grafana/provisioning:ro", "./infra/grafana/dashboards:/var/lib/grafana/dashboards:ro"]
    ports: ["127.0.0.1:${GRAFANA_PORT:-3001}:3000"]
    depends_on: [db, prometheus, loki, tempo]
    networks: [web]
  collector:
    image: otel/opentelemetry-collector-contrib@sha256:e40d61f10c9a617cca1ffd1be4d7e2b3a4b0f0001798ff07e58cabe82e618cea
    restart: unless-stopped
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes: ["./infra/collector.yaml:/etc/otelcol/config.yaml:ro"]
    depends_on: [loki, tempo]
    networks: [web]
  tempo:
    image: grafana/tempo@sha256:1ce31d6d7ffab62189685e8c47881d4a561c5d38bd0dbd66e40ca83cef07923d
    restart: unless-stopped
    command: ["-config.file=/etc/tempo.yaml"]
    volumes: ["./infra/tempo.yaml:/etc/tempo.yaml:ro", "tempo_data:/var/tempo"]
    networks: [web]
  loki:
    image: grafana/loki@sha256:b43c257ccfc925d4a50b8717cac61a3b51df8c48d01847936057e5c4075a24a7
    restart: unless-stopped
    command: ["-config.file=/etc/loki/config.yaml"]
    volumes: ["./infra/loki.yaml:/etc/loki/config.yaml:ro", "loki_data:/loki"]
    networks: [web]
  blackbox:
    image: prom/blackbox-exporter@sha256:ea1c7aa3ef3f307cd03e85f34abb604478ccb90b567fc690da0cd9776da76b13
    restart: unless-stopped
    command: ["--config.file=/etc/blackbox.yaml"]
    volumes: ["./infra/blackbox.yaml:/etc/blackbox.yaml:ro"]
    networks: [web]
networks:
  web:
    ipam:
      config:
        - subnet: ${INTERNAL_SUBNET:-172.30.0.0/24}
volumes:
  postgres_data:
  caddy_data:
  caddy_config:
  prometheus_data:
  grafana_data:
  tempo_data:
  loki_data:
