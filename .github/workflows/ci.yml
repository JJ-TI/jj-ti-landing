name: CI
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:
permissions: {}
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    name: Validate project
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@7f4fc3e22c37d6ff65e88745f38bd3157c663f7c
        with:
          python-version: '3.12'
      - run: npm ci --ignore-scripts
      - run: python3 -m pip install -r requirements-dev.txt
      - run: npm run lint
      - run: npm run check
      - run: npm audit --audit-level=high
      - name: Scan source for secrets
        run: |
          detect-secrets scan --all-files --exclude-files '^(node_modules|playwright-report|test-results)/' --exclude-secrets '^(b33555bdfb50fc558d73c4a96a0fc1264fd7d2df|fac8e8aae689b3457096655b165977086bf13510)$' > /tmp/secrets.json
          python3 -c "import json; report=json.load(open('/tmp/secrets.json')); assert not report['results'], 'Potential secrets detected; inspect locally without publishing findings'"
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - name: Browser evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: browser-test-report
          path: playwright-report/
          retention-days: 7
