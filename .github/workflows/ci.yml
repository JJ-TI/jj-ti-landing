name: CI
on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:
permissions: {}
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    name: Validate project
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@7f4fc3e22c37d6ff65e88745f38bd3157c663f7c
        with:
          python-version: '3.12'
      - run: npm ci --ignore-scripts
      - run: python3 -m pip install -r requirements-dev.txt
      - run: npm run lint
      - run: npm run check
      - name: Build isolated design preview
        run: python3 scripts/build_preview.py --output "$RUNNER_TEMP/landing-preview"
      - run: npm audit --audit-level=high
      - name: Scan source for secrets
        run: python3 scripts/check_secrets.py
      - name: Real PostgreSQL and SMTP integration
        run: npm run test:integration
      - name: Validate infrastructure configuration
        run: python3 scripts/validate_infra.py
      - name: Container build
        run: docker build -t jjti-web-api:ci .
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - name: Browser evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: browser-test-report
          path: playwright-report/
          retention-days: 7
