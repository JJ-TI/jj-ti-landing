name: Mejora o tarea
description: Trabajo trazable de la landing
body:
  - type: dropdown
    id: priority
    attributes:
      label: Prioridad
      options: [P0, P1, P2]
    validations:
      required: true
  - type: textarea
    id: objective
    attributes:
      label: Objetivo y alcance
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Criterios de aceptación y evidencia
      description: Condiciones verificables; indicar dependencias externas.
    validations:
      required: true
